name = "sai-yip-api"
main = "workers/sai-api/worker.js"
compatibility_date = "2026-11-12"

# Cloudflare Workers AI — question generation
[ai]
binding = "AI"

# Cron trigger — weekly question batch refresh
[triggers]
crons = ["0 3 * * 1"]

# Public config (committed to repo, visible in dashboard)
[vars]
SHEET_ID = "1lcxrQvlrkJ93cPTavBqhcoxzO9twGmwA8sSQSu_blEg"
CORS_ORIGIN = "https://sai-yip.pages.dev"
APP_ENV = "development"

# Secrets (set via `wrangler secret put`, NOT committed)
[secrets]
required = ["JWT_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_SERVICE_ACCOUNT_KEY"]

# Observability
[observability]
enabled = true
head_sampling_rate = 0.1
